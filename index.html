<!doctype html>
<html lang="en" class="is-loading">
<head>
  <meta charset="utf-8">
  <!-- Favicon: black ghost for light browser tabs, white ghost for dark ones -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/ghost-black-32.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/ghost-white-32.png" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/brand/ghost-black-192.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/brand/ghost-white-192.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPXTR — Built for the send</title>
  <meta name="description" content="Hard-wearing apparel for moto, action sports and tactical. Rider tested, crash approved.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800;900&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Metal+Mania&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/store.css">
  <script src="assets/js/accent.js"></script>
</head>
<body>
  <div id="chrome-top"></div>

  <main>
    <!-- HERO -->
    <section class="hero">
      <div class="hero__img"><img id="hero-img" alt=""></div>
      <span class="hero__stripes"></span>
      <span class="corners"></span>
      <div class="wrap hero__inner">
        <span class="stamp">Rider tested</span>
        <div class="hero__grid"><span id="hero-eyebrow"></span><span>Built for the send</span></div>
        <h1 class="display" id="hero-title"></h1>
        <p id="hero-sub"></p>
        <div class="hero__ctas">
          <a class="btn" href="shop/?filter=new" id="hero-cta"></a>
          <a class="btn btn--ghost" href="#team">Meet the team</a>
        </div>
        <div class="hero__bar" id="hero-bar"></div>
      </div>
    </section>

    <!-- TICKER -->
    <div class="marquee" aria-hidden="true">
      <div class="marquee__track" id="marquee"></div>
    </div>

    <!-- SEC.01 DISCIPLINES -->
    <section class="section">
      <div class="wrap">
        <div class="section-head">
          <div><span class="eyebrow" id="pages-eyebrow"></span><h2 class="display" id="pages-title"></h2></div>
          <a href="shop/" class="link-arrow"><span id="pages-link"></span> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></a>
        </div>
        <div class="disc" id="disc"></div>
      </div>
    </section>

    <!-- SEC.02 NEW SEASON -->
    <section class="section" style="padding-top:0">
      <div class="wrap">
        <div class="section-head">
          <div><span class="eyebrow" id="season-eyebrow"></span><h2 class="display" id="new-title"></h2><p id="new-intro"></p></div>
          <div class="rail-ctrls">
            <button aria-label="Previous" data-rail="-1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 6-6 6 6 6"/></svg></button>
            <button aria-label="Next" data-rail="1"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 6 6 6-6 6"/></svg></button>
          </div>
        </div>
        <div class="rail" id="rail"></div>
      </div>
    </section>

    <!-- SEC.03 TEAM -->
    <section class="section" id="team" style="padding-top:0">
      <div class="wrap">
        <div class="section-head">
          <div><span class="eyebrow" id="team-eyebrow"></span><h2 class="display" id="team-title"></h2><p id="team-intro"></p></div>
          <a href="#" class="link-arrow" id="team-cta"><span></span> <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></a>
        </div>
        <div class="team" id="team-grid"></div>
      </div>
    </section>

    <!-- SEC.04 NEXT EVENT -->
    <section class="section event" id="event">
      <div class="event__bg"><img alt="" loading="lazy" id="event-img"></div>
      <div class="wrap event__grid">
        <div>
          <span class="eyebrow" id="event-eyebrow">Sec. 04 // Next event</span>
          <h2 class="display" id="event-title"></h2>
          <p id="event-blurb"></p>
          <div class="event__meta" id="event-meta"></div>
          <a class="btn" href="#" id="event-cta"></a>
        </div>
        <div class="clock">
          <div class="clock__label">Gates open in</div>
          <div class="clock__row" id="clock">
            <div><b data-u="d">00</b><small>Days</small></div>
            <div><b data-u="h">00</b><small>Hrs</small></div>
            <div><b data-u="m">00</b><small>Min</small></div>
            <div><b data-u="s">00</b><small>Sec</small></div>
          </div>
          <form id="event-notify"><input type="email" required placeholder="Email for event alerts" aria-label="Email for event alerts"><button type="submit">Notify me</button></form>
        </div>
      </div>
    </section>

    <!-- SEC.05 CREW FAVOURITES -->
    <section class="section">
      <div class="wrap">
        <div class="section-head">
          <div><span class="eyebrow" id="best-eyebrow"></span><h2 class="display" id="best-title"></h2></div>
          <div class="tabs" role="tablist" id="best-tabs">
            <button class="tab active" data-c="All">All</button>
            <button class="tab" data-c="Hoodies">Hoodies</button>
            <button class="tab" data-c="Tees">Tees</button>
            <button class="tab" data-c="Outerwear">Outerwear</button>
            <button class="tab" data-c="Headwear">Headwear</button>
          </div>
        </div>
        <div class="products" id="best"></div>
        <div style="text-align:center;margin-top:52px"><a href="shop/" class="btn btn--ghost">Shop all gear</a></div>
      </div>
    </section>

    <!-- SEC.06 TESTED -->
    <section class="section" id="tested" style="padding-top:0">
      <div class="wrap field">
        <div class="field__imgs" id="tested-imgs"></div>
        <div class="spec">
          <span class="eyebrow" id="tested-eyebrow"></span>
          <h2 class="display" id="tested-title"></h2>
          <p id="tested-intro"></p>
          <table id="tested-specs"></table>
          <a class="btn" href="shop/" id="tested-cta"></a>
        </div>
      </div>
    </section>

    <!-- SEC.07 CREW REPORTS -->
    <section class="section" style="padding-top:0">
      <div class="wrap">
        <div class="section-head">
          <div><span class="eyebrow" id="reports-eyebrow"></span><h2 class="display" id="reports-title"></h2></div>
          <a href="#" class="link-arrow" id="ig-handle">Follow <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></a>
        </div>
        <div class="reports" id="reports"></div>
        <div class="ig" id="ig">        </div>
      </div>
    </section>

    <!-- TEAM ORDERS STRIP -->
    <section class="served" id="served">
      <div class="wrap">
        <div><h3 id="served-title"></h3><p id="served-text"></p></div>
        <a class="btn" href="#" id="served-cta"></a>
      </div>
    </section>

    <!-- NEWSLETTER -->
    <section class="section newsletter" id="newsletter">
      <div class="newsletter__bg"><img src="assets/img/news-dirt.jpg" alt="" loading="lazy"></div>
      <div class="wrap">
        <span class="eyebrow" id="news-eyebrow"></span>
        <h2 class="display" id="news-title"></h2>
        <p id="news-text"></p>
        <form id="news">
          <input type="email" required placeholder="Enter your email" aria-label="Email address">
          <button type="submit">Sign up</button>
        </form>
        <div class="fine" id="news-fine"></div>
      </div>
    </section>
  </main>

  <div id="chrome-bottom"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/vendor/supabase-2.116.0.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/cms.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/page-home.js"></script>
</body>
</html>
