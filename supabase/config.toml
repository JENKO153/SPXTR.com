# Supabase CLI settings used when deploying the Edge Functions (see SETUP.md, Part 2).
# None of these functions use the gateway's token check:
#   create-checkout      is called by shoppers, who aren't logged in
#   stripe-webhook       is called by Stripe, and checks Stripe's signature instead
#   send-shipping-email  checks the admin's session in the database instead
project_id = "spxtr"

[functions.create-checkout]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.send-shipping-email]
verify_jwt = false

# Called from the admin's Orders screen; checks the admin's session and password window itself.
[functions.refund-order]
verify_jwt = false

# The public review form; spam-checked inside the function.
[functions.submit-review]
verify_jwt = false
