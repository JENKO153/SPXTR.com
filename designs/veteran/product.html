<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product — Lanny Supply Co.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800;900&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/store.css">
</head>
<body>
  <div id="chrome-top"></div>

  <main class="wrap">
    <div class="crumbs" style="padding-top:28px" id="crumbs"></div>
    <div class="pdp" id="pdp"></div>

    <section style="padding-bottom:120px">
      <div class="section-head"><div><span class="eyebrow">// Complete the kit</span><h2 class="display">Pairs well with</h2></div></div>
      <div class="products" id="related"></div>
    </section>
  </main>

  <div id="chrome-bottom"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    const products = liveProducts();
    const p = DB.products().find(x => x.id === new URLSearchParams(location.search).get('id')) || products[0];
    renderChrome(p.category);
    document.title = `${p.name} — ${STORE.name}`;

    $('#crumbs').innerHTML = `<a href="index.html">Home</a> // <a href="shop.html?category=${encodeURIComponent(p.category)}">${p.category}</a> // ${p.name}`;

    // A real catalogue would have several shots per product; the demo reuses lifestyle imagery as alternates.
    const alts = products.filter(x => x.category === p.category && x.id !== p.id).slice(0, 2).map(x => x.img);
    while (alts.length < 2) alts.push(['field-kit.jpg', 'boots-worn.jpg'][alts.length]);

    // Founder's field notes: one per category, so every product page carries the founder's voice.
    const NOTES = {
      Tees: "Boxy on purpose, like the PT shirts we lived in. Size down if you want it closer to the body.",
      Hoodies: "This is the one I wear on the 5am dog walk. Heavy, warm, and it holds its shape. True to size.",
      Headwear: "Pre-washed so it's broken in from day one. One size fits most, with an adjustable strap.",
      Outerwear: "I wear-tested this through a full winter before it went into production. Take your usual size.",
      Gear: "Built to get thrown in the back of a truck and keep going. Lifetime guarantee, no questions asked.",
      default: "Small run, so once it's gone, it's gone. True to size.",
    };

    const low = p.stock < 15;
    $('#pdp').innerHTML = `
      <div class="pdp__gallery">
        <div class="main" id="zoom"><img src="${IMG}${p.img}" alt="${p.name}"><span class="corners"></span></div>
        ${alts.map(a => `<div class="alt"><img src="${IMG}${a}" alt="" loading="lazy"></div>`).join('')}
      </div>
      <div class="pdp__info">
        <span class="eyebrow">${p.sku || p.id.toUpperCase()} // ${p.category}</span>
        <h1 class="display">${p.name}</h1>
        <div class="pdp__price">${money(p.price)}${p.compareAt ? `<s>${money(p.compareAt)}</s>` : ''}</div>
        <div><span class="stars">${stars(p.rating)}</span> <span class="muted" style="font:500 12px var(--mono);text-transform:uppercase">${p.rating} // ${p.reviews} field reports</span></div>
        <p style="margin:22px 0 0">${p.desc}</p>

        <div class="pdp__opt">
          <div class="pdp__opt-head"><span>Colour</span><span>${p.spec || ''}</span></div>
          <div class="color-row">${p.colors.map((c, i) => `<button class="${i ? '' : 'on'}" style="background:${c}" aria-label="Colour ${i + 1}"></button>`).join('')}</div>
        </div>
        <div class="pdp__opt">
          <div class="pdp__opt-head"><span id="size-label">Select size</span><a href="#">Size guide</a></div>
          <div class="size-row" id="sizes">${p.sizes.map(s => `<button data-s="${s}">${s}</button>`).join('')}</div>
        </div>
        <div class="stock-note ${low ? 'low' : ''}"><i></i>${low ? `Only ${p.stock} left. Won't be restocked` : 'In stock // ships in 1–2 business days'}</div>
        <button class="btn btn--block" id="add">Add to kit // ${money(p.price)}</button>

        <div class="perks">
          <div><b>${STORE.giveBackPercent}% to vets</b>${money((p.price * STORE.giveBackPercent / 100).toFixed(2))} of this goes to veteran charities</div>
          <div><b>${STORE.militaryDiscount}% off if you served</b>Verify once at checkout</div>
          <div><b>Lifetime guarantee</b>On every seam and stitch</div>
          <div><b>Free shipping</b>On orders over ${money(STORE.freeShippingOver)}</div>
        </div>

        <div class="maker-note">
          <img src="assets/img/founder.jpg" alt="">
          <div><span class="hand">// Field notes from ${STORE.founder}</span><p>${NOTES[p.category] || NOTES.default}</p></div>
        </div>

        <div class="accordion">
          <details open><summary>Details</summary><p>${p.desc}</p></details>
          <details><summary>Materials &amp; care</summary><p>${p.spec || 'Heavyweight cotton'}. Wash cold, inside out. Hang dry. Built to handle whatever you throw at it.</p></details>
          <details><summary>Shipping &amp; returns</summary><p>Free shipping on orders over ${money(STORE.freeShippingOver)}. Free returns and exchanges within 30 days.</p></details>
        </div>
      </div>`;

    let size = p.sizes.length === 1 ? p.sizes[0] : null;
    if (size) $('#sizes button').classList.add('on');
    $('#sizes').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      $$('#sizes button').forEach(x => x.classList.toggle('on', x === b));
      $('#sizes').classList.remove('error');
      size = b.dataset.s; $('#size-label').textContent = 'Size: ' + size;
    };
    $$('.color-row button').forEach(b => b.onclick = () => $$('.color-row button').forEach(x => x.classList.toggle('on', x === b)));
    $('#add').onclick = () => {
      if (!size) { $('#sizes').classList.add('error'); $('#size-label').textContent = 'Pick a size first'; return; }
      addToCart(p.id, size, 1, { open: true });
      if (!LIVE) openCart();
    };
    $('#zoom').onclick = () => $('#zoom').classList.toggle('zoom');

    const related = products.filter(x => x.id !== p.id && x.category !== p.category).sort((a, b) => b.reviews - a.reviews).slice(0, 4);
    $('#related').innerHTML = related.map(productCard).join('');
  </script>
</body>
</html>
